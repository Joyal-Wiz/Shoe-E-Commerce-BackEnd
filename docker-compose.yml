version: '3.8'

services:
  ecommerce-api:
    build:
      context: .
      dockerfile: ECommerce.Api/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ECommerceDb;User=sa;Password=YourStrong@123;TrustServerCertificate=True

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - SA_PASSWORD=YourStrong@123
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"